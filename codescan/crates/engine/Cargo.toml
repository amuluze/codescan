[package]
name = "codescan-engine"
description = "Deterministic local AST rule engine for the Codescan desktop app"
version.workspace = true
edition.workspace = true
authors.workspace = true
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
regex = "1"
ignore = "0.4"
sha2 = "0.10"
rayon = "1"
tree-sitter = "0.27"
tree-sitter-typescript = "0.23"
tree-sitter-javascript = "0.25"
tree-sitter-python = "0.25"
tree-sitter-java = "0.23"
tree-sitter-go = "0.25"
tree-sitter-rust = "0.24"

[dev-dependencies]
tempfile = "3"

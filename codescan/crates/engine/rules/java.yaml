# Java AST 规则。fixture 位于 tests/fixtures/rules/<rule-id>/。
rules:
  - id: java/runtime-exec
    language: java
    dimension: security
    severity: error
    message: 通过 Runtime.getRuntime().exec() 执行外部命令
    pattern: |
      (method_invocation
        object: (method_invocation
          object: (identifier) @runtime
          name: (identifier) @getter)
        name: (identifier) @name) @match
    metavariables:
      - capture: runtime
        regex: '^Runtime$'
      - capture: getter
        regex: '^getRuntime$'
      - capture: name
        regex: '^exec$'

  - id: java/process-builder
    language: java
    dimension: security
    severity: error
    message: 使用 ProcessBuilder 构造外部进程
    pattern: |
      (object_creation_expression
        type: [(type_identifier) (scoped_type_identifier)] @type) @match
    metavariables:
      - capture: type
        regex: '(^|\.)ProcessBuilder$'

  - id: java/object-input-stream
    language: java
    dimension: security
    severity: error
    message: 创建 ObjectInputStream 反序列化输入流
    pattern: |
      (object_creation_expression
        type: [(type_identifier) (scoped_type_identifier)] @type) @match
    metavariables:
      - capture: type
        regex: '(^|\.)ObjectInputStream$'

  - id: java/read-object
    language: java
    dimension: security
    severity: warning
    message: 显式接收者调用 readObject()（需确认接收者为 ObjectInputStream）
    pattern: |
      (method_invocation
        object: (identifier) @obj
        name: (identifier) @name (#eq? @name "readObject")) @match
    metavariables:
      - capture: obj
        regex: '^(in|input|ois|objectInput|objectInputStream)$'
    filters:
      - inside:
          pattern: |
            [
              (method_declaration
                parameters: (formal_parameters
                  (formal_parameter
                    type: [(type_identifier) (scoped_type_identifier)] @type
                    (#match? @type "ObjectInputStream$"))))
              (method_declaration
                body: (block
                  (local_variable_declaration
                    type: [(type_identifier) (scoped_type_identifier)] @type
                    (#match? @type "ObjectInputStream$"))))
            ] @match

  - id: java/read-object-field
    language: java
    dimension: security
    severity: warning
    message: 显式接收者调用 readObject()（接收者为 ObjectInputStream 字段）
    pattern: |
      (method_invocation
        object: (identifier) @obj
        name: (identifier) @name (#eq? @name "readObject")) @match
    field_receiver: true

  - id: java/weak-message-digest
    language: java
    dimension: security
    severity: error
    message: MessageDigest 使用弱哈希算法（MD5/SHA-1）
    pattern: |
      (method_invocation
        object: (_) @digest
        name: (identifier) @name
        arguments: (argument_list
          (string_literal) @alg)) @match
    metavariables:
      - capture: digest
        regex: '(^|\.)MessageDigest$'
      - capture: name
        regex: '^getInstance$'
      - capture: alg
        regex: '^"(MD5|SHA-?1)"$'

  - id: java/insecure-random
    language: java
    dimension: security
    severity: warning
    message: 使用 Random 生成随机数（安全场景应使用 SecureRandom）
    pattern: |
      (object_creation_expression
        type: [(type_identifier) (scoped_type_identifier)] @type) @match
    metavariables:
      - capture: type
        regex: '(^|\.)Random$'

  - id: java/trust-all-certs
    language: java
    dimension: security
    severity: error
    message: 在实现 X509TrustManager 的类中声明 checkClientTrusted/checkServerTrusted 方法（需确认是否空实现）
    pattern: |
      (method_declaration
        name: (identifier) @name (#match? @name "^check(Client|Server)Trusted$")) @match
    filters:
      - inside:
          pattern: |
            [
              (class_declaration
                interfaces: (super_interfaces
                  (type_list
                    [(type_identifier) (scoped_type_identifier)] @iface
                    (#match? @iface "(^|[.])X509TrustManager$"))))
              (object_creation_expression
                type: [(type_identifier) (scoped_type_identifier)] @iface
                (#match? @iface "(^|[.])X509TrustManager$"))
            ] @match

  # v2 类型层：解析 extends/implements 闭包，覆盖间接继承 X509TrustManager。
  # 直接实现仍由 java/trust-all-certs 负责，本规则只报非直接实现类，避免重复。
  - id: java/trust-all-certs-inherited
    language: java
    dimension: security
    severity: warning
    message: 通过继承间接实现 X509TrustManager 的空 checkClientTrusted/checkServerTrusted（需人工确认）
    inheritance:
      target: X509TrustManager
      methods:
        - checkClientTrusted
        - checkServerTrusted
      empty_only: true
      indirect_only: true

  - id: java/junit-assert
    language: java
    dimension: business-logic
    severity: warning
    message: 在生产代码中调用 JUnit Assert 断言（鉴权等校验不应依赖测试断言）
    pattern: |
      (method_invocation
        object: (identifier) @assert (#eq? @assert "Assert")
        name: (identifier) @name (#match? @name "^assert(True|False|Equals|NotEquals|NotNull|Null|ArrayEquals|Throws|That)$")) @match

  # ---------- 污点（v2.2，过程内近似，Domain §4a） ----------
  - id: java/taint-exec-param
    language: java
    dimension: security
    severity: error
    message: 不可信参数可能流入 Runtime.exec（过程内污点近似）
    taint:
      sources:
        - |
          (method_declaration
            parameters: (formal_parameters
              (formal_parameter name: (identifier) @match))) @match
      sinks:
        - |
          (method_invocation
            name: (identifier) @name (#eq? @name "exec")) @match
      sanitizers:
        - |
          (method_invocation
            object: (identifier) @obj (#eq? @obj "Integer")
            name: (identifier) @name (#eq? @name "parseInt")) @match

  - id: java/taint-sql-param
    language: java
    dimension: security
    severity: error
    message: 不可信参数可能流入 SQL 查询执行（过程内污点近似）
    taint:
      sources:
        - |
          (method_declaration
            parameters: (formal_parameters
              (formal_parameter name: (identifier) @match))) @match
      sinks:
        - |
          (method_invocation
            name: (identifier) @name (#eq? @name "executeQuery")) @match
        - |
          (method_invocation
            name: (identifier) @name (#eq? @name "executeUpdate")) @match
      sanitizers:
        - |
          (method_invocation
            object: (identifier) @obj (#eq? @obj "Integer")
            name: (identifier) @name (#eq? @name "parseInt")) @match

  - id: java/taint-processbuilder-param
    language: java
    dimension: security
    severity: warning
    message: 不可信参数可能流入 ProcessBuilder（过程内污点近似）
    taint:
      sources:
        - |
          (method_declaration
            parameters: (formal_parameters
              (formal_parameter name: (identifier) @match))) @match
      sinks:
        - |
          (object_creation_expression
            type: (type_identifier) @type (#eq? @type "ProcessBuilder")) @match
      sanitizers:
        - |
          (method_invocation
            object: (identifier) @obj (#eq? @obj "Integer")
            name: (identifier) @name (#eq? @name "parseInt")) @match

  # ---------- Java 高价值补充（规则库质量批次 2） ----------
  - id: java/xml-decoder
    language: java
    dimension: security
    severity: warning
    message: 创建 XMLDecoder（反序列化 XML 可执行构造，需确认输入可信）
    pattern: |
      (object_creation_expression
        type: [(type_identifier) (scoped_type_identifier)] @type) @match
    metavariables:
      - capture: type
        regex: '(^|\.)XMLDecoder$'

  - id: java/url-open-connection
    language: java
    dimension: security
    severity: warning
    message: 对 URL 发起 openConnection（目标由输入决定时需确认 SSRF）
    pattern: |
      (method_invocation
        object: (object_creation_expression
          type: [(type_identifier) (scoped_type_identifier)] @type)
        name: (identifier) @name (#eq? @name "openConnection")) @match
    metavariables:
      - capture: type
        regex: '(^|\.)URL$'

# Python AST 规则。fixture 位于 tests/fixtures/rules/<rule-id>/。
# 格式见 docs/rules.md：@match 捕获决定 span；#eq?/#match? 为 tree-sitter 原生谓词。
rules:
  # ---------- security ----------
  - id: py/no-eval-exec
    language: python
    dimension: security
    severity: error
    message: 调用 eval()/exec() 动态执行代码
    pattern: |
      (call
        function: (identifier) @match (#match? @match "^(eval|exec)$"))

  - id: py/pickle-loads
    language: python
    dimension: security
    severity: error
    message: 调用 pickle.load/loads 反序列化对象
    pattern: |
      (call
        function: (attribute
          object: (identifier) @mod (#match? @mod "^(pickle|cPickle|_pickle|dill)$")
          attribute: (identifier) @match (#match? @match "^(load|loads)$")))

  - id: py/yaml-load-without-loader
    language: python
    dimension: security
    severity: error
    message: yaml.load 未指定 SafeLoader/CSafeLoader
    pattern: |
      (call
        function: (attribute
          object: (identifier) @mod (#eq? @mod "yaml")
          attribute: (identifier) @fn (#eq? @fn "load")) @match)
    filters:
      - not:
          # 仅排除显式安全加载器（SafeLoader/CSafeLoader）；Loader=None、
          # UnsafeLoader 等仍视为未通过安全加载器校验。
          pattern: |
            (call
              function: (attribute
                object: (identifier) @nmod (#eq? @nmod "yaml")
                attribute: (identifier) @nfn (#eq? @nfn "load"))
              arguments: (argument_list
                (keyword_argument
                  name: (identifier) @loader (#eq? @loader "Loader")
                  value: [(identifier) (attribute)] @loader_value
                  (#match? @loader_value "SafeLoader$")))) @match
      - not:
          # 位置参数形式：yaml.load(text, yaml.SafeLoader)
          pattern: |
            (call
              function: (attribute
                object: (identifier) @nmod (#eq? @nmod "yaml")
                attribute: (identifier) @nfn (#eq? @nfn "load"))
              arguments: (argument_list
                . (_)
                . [(identifier) (attribute)] @loader_value
                (#match? @loader_value "SafeLoader$"))) @match

  - id: py/subprocess-shell-true
    language: python
    dimension: security
    severity: error
    message: subprocess 调用使用 shell=True（命令经由 shell 解释）
    pattern: |
      (call
        function: (attribute
          object: (identifier) @mod (#eq? @mod "subprocess")
          attribute: (identifier) @fn (#match? @fn "^(run|call|Popen|check_output|check_call)$"))
        arguments: (argument_list
          (keyword_argument
            name: (identifier) @kw (#eq? @kw "shell")
            value: (true)) @match))

  - id: py/os-system
    language: python
    dimension: security
    severity: error
    message: 调用 os.system/os.popen 执行 shell 命令
    pattern: |
      (call
        function: (attribute
          attribute: (identifier) @fn)) @match

      (call
        function: (identifier) @fn) @match
    metavariables:
      - capture: fn
        regex: '^(system|popen)$'
    imports:
      - '\bos\b'
    imported_symbols:
      - system
      - popen

  - id: py/weak-hash
    language: python
    dimension: security
    severity: warning
    message: 使用弱哈希算法 md5/sha1
    pattern: |
      (call
        function: (attribute
          attribute: (identifier) @fn)) @match

      (call
        function: (identifier) @fn) @match
    metavariables:
      - capture: fn
        regex: '^(md5|sha1)$'
    imports:
      - '\bhashlib\b'
    imported_symbols:
      - md5
      - sha1

  # assert 用于鉴权/加密类逻辑：生产环境可被 -O 移除，绕过校验。
  # 引擎 v1 无数据流，按语句文本中的敏感关键词启发式判定。
  - id: py/assert-in-auth
    language: python
    dimension: security
    severity: warning
    message: assert 语句涉及鉴权/密钥类校验（生产环境 -O 下会被移除）
    pattern: |
      (assert_statement) @match
    metavariables:
      - capture: match
        regex: '(?is).*(password|passwd|token|secret|permission|role|admin|auth|api[_-]?key|signature).*'

  # ---------- business-logic（示例骨架） ----------
  # 示例骨架：Django 视图函数（首参 request）以 delete/destroy/remove/admin_
  # 开头命名却未加任何装饰器（权限校验通常以 @permission_required 等装饰器挂载）。
  - id: py/example-django-view-unprotected
    language: python
    dimension: business-logic
    severity: warning
    message: 示例骨架：疑似未挂权限校验装饰器的 Django 管理类视图函数
    pattern: |
      (function_definition
        name: (identifier) @match (#match? @match "^(delete|destroy|remove|admin)_")
        parameters: (parameters (identifier) @req (#eq? @req "request")))
    filters:
      - not:
          pattern: |
            (decorated_definition) @match

  # ---------- 污点（v2.1，过程内近似，Domain §4a） ----------
  - id: py/taint-eval-input
    language: python
    dimension: security
    severity: error
    message: input() 输入可能流入 eval()（过程内污点近似）
    taint:
      sources:
        - |
          (call
            function: (identifier) @fn (#eq? @fn "input")) @match
      sinks:
        - |
          (call
            function: (identifier) @fn (#eq? @fn "eval")) @match
      sanitizers:
        - |
          (call
            function: (identifier) @fn (#eq? @fn "int")) @match

  - id: py/taint-eval-param
    language: python
    dimension: security
    severity: error
    message: 不可信参数可能流入 eval()（过程内污点近似）
    taint:
      sources:
        - |
          (function_definition
            parameters: (parameters (identifier) @match)) @match
      sinks:
        - |
          (call
            function: (identifier) @fn (#eq? @fn "eval")) @match
      sanitizers:
        - |
          (call
            function: (identifier) @fn (#eq? @fn "int")) @match

  - id: py/taint-os-system-request
    language: python
    dimension: security
    severity: error
    message: request.args 可能流入 os.system（过程内污点近似）
    taint:
      sources:
        - |
          (attribute
            object: (identifier) @obj (#eq? @obj "request")
            attribute: (identifier) @attr (#eq? @attr "args")) @match
      sinks:
        - |
          (call
            function: (attribute
              attribute: (identifier) @attr (#eq? @attr "system"))) @match

  - id: py/taint-os-system-request-alias
    language: python
    dimension: security
    severity: error
    message: 别名导入的 request.args 可能流入 os.system（过程内污点近似）
    taint:
      sources:
        - |
          (attribute
            object: (_) @obj
            attribute: (identifier) @attr (#eq? @attr "args")) @match
      sinks:
        - |
          (call
            function: (attribute
              attribute: (identifier) @attr (#eq? @attr "system"))) @match
    imports:
      - 'from\s+flask\s+import\s+request\s+as\s+'
      - 'import\s+flask\s+as\s+'
    imported_symbols:
      - request
      - flask.request

  - id: py/taint-exec-param
    language: python
    dimension: security
    severity: error
    message: 不可信参数可能流入 exec()（过程内污点近似）
    taint:
      sources:
        - |
          (function_definition
            parameters: (parameters (identifier) @match)) @match
      sinks:
        - |
          (call
            function: (identifier) @fn (#eq? @fn "exec")) @match
      sanitizers:
        - |
          (call
            function: (identifier) @fn (#eq? @fn "int")) @match

  # ---------- Python 高价值补充（v1 规则库扩展） ----------
  - id: py/requests-verify-false
    language: python
    dimension: security
    severity: warning
    message: requests 调用显式关闭 TLS 证书校验（verify=False）
    pattern: |
      (call
        function: (attribute
          object: (identifier) @mod (#eq? @mod "requests")
          attribute: (identifier) @fn (#match? @fn "^(get|post|put|delete|patch|head|options|request)$"))
        arguments: (argument_list
          (keyword_argument
            name: (identifier) @kw (#eq? @kw "verify")
            value: (false)))) @match

  - id: py/mark-safe
    language: python
    dimension: security
    severity: warning
    message: 调用 mark_safe 跳过 HTML 转义（需确认输入可信）
    pattern: |
      (call
        function: (identifier) @fn (#eq? @fn "mark_safe")) @match

      (call
        function: (attribute
          attribute: (identifier) @fn (#eq? @fn "mark_safe"))) @match

  # ---------- Python 高价值补充（规则库质量批次 2） ----------
  - id: py/flask-debug-run
    language: python
    dimension: security
    severity: warning
    message: Flask 应用以 debug=True 启动（生产环境应关闭调试器）
    pattern: |
      (call
        function: (attribute
          object: (identifier) @obj (#match? @obj "^(app|application)$")
          attribute: (identifier) @fn (#eq? @fn "run"))
        arguments: (argument_list
          (keyword_argument
            name: (identifier) @kw (#eq? @kw "debug")
            value: (true)))) @match

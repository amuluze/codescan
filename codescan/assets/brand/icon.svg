<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-label="CodeScan icon">
  <defs>
    <linearGradient id="tile" x1="96" y1="64" x2="928" y2="960" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#131e30"/>
      <stop offset="0.55" stop-color="#0e1624"/>
      <stop offset="1" stop-color="#0a1019"/>
    </linearGradient>
    <linearGradient id="mark" x1="268" y1="248" x2="760" y2="760" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5b9cff"/>
      <stop offset="1" stop-color="#7ce6ff"/>
    </linearGradient>
    <linearGradient id="sheen" x1="256" y1="160" x2="768" y2="640" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- app tile -->
  <rect x="112" y="112" width="800" height="800" rx="186" fill="url(#tile)"/>
  <rect x="112" y="112" width="800" height="800" rx="186" fill="url(#sheen)"/>
  <rect x="116" y="116" width="792" height="792" rx="182" fill="none" stroke="#2b3d58" stroke-width="8"/>

  <!-- scan lens -->
  <circle cx="462" cy="462" r="206" fill="none" stroke="url(#mark)" stroke-width="64"/>
  <path d="M618 618 L742 742" fill="none" stroke="url(#mark)" stroke-width="88" stroke-linecap="round"/>

  <!-- code glyph -->
  <path d="M404 356 L322 462 L404 568" fill="none" stroke="#edf4ff" stroke-width="62"
        stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M520 356 L602 462 L520 568" fill="none" stroke="#edf4ff" stroke-width="62"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>

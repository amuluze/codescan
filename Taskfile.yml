version: '3'

# Codescan 任务入口（taskfile.dev）。
#
# 定位：人机友好的编排层——底层命令一律委托根 package.json 的 npm scripts，
# 根 scripts 只转发到 codescan/package.json，不复制命令实现。
# codescan/package.json 是命令实现的单一权威来源（CI 与文档引用同一命令）；
# 改命令只改该文件一处，Taskfile 自动跟随。`task --list` 查看全部任务。
#
# 平台支持：仅 macOS Apple Silicon（arm64）。Windows / Linux 构建暂不支持。

vars:
  TARGET: aarch64-apple-darwin

tasks:
  default:
    desc: 列出全部任务
    cmd: task --list

  # ── 开发 ──────────────────────────────────────────────────────────────

  install:
    desc: 安装依赖（Node 22+ / pnpm 10+ / Rust 1.96）
    cmd: pnpm run setup

  dev:
    desc: 浏览器开发模式（无原生能力）
    cmd: pnpm run dev

  dev:app:
    desc: Tauri 桌面开发模式（启用 SQLite / 文件对话框）
    cmd: pnpm run tauri -- dev

  # ── 编译（仅 macOS Apple Silicon）────────────────────────────────────

  build:
    desc: 前端生产构建
    cmd: pnpm run build

  build:app:
    desc: 本地 release 构建 .app（arm64，base 配置快速验证，adhoc 不签名）
    platforms: [darwin]
    preconditions:
      - sh: 'test "$(uname -m)" = arm64'
        msg: '仅支持 macOS Apple Silicon（arm64）'
    cmd: pnpm run build:app

  build:dmg:
    desc: |
      本地 release 构建 macOS arm64 DMG（.app + .dmg + updater 工件）。
      构建前自动 source ~/.codescan/release-credentials.env（可选，0600 不入库）：
      提供 APPLE_SIGNING_IDENTITY + 公证凭据时 tauri 自动签名并公证 staple，
      提供 TAURI_SIGNING_PRIVATE_KEY 时产出 updater 工件（.app.tar.gz + .sig）；
      缺省保持 adhoc 未公证（updater 剥离），不视为失败。
    platforms: [darwin]
    preconditions:
      - sh: 'test "$(uname -m)" = arm64'
        msg: '仅支持 macOS Apple Silicon（arm64）'
    # generate-release-config 与凭据 source 必须同条执行（cmd 间独立 shell）：
    # updater 自动检测依赖 TAURI_SIGNING_PRIVATE_KEY 环境变量，分离会导致
    # 配置被剥离、构建静默产出无 updater 工件（axiom 同款踩坑注释）
    cmd: |
      set -euo pipefail
      if [ -f "$HOME/.codescan/release-credentials.env" ]; then
        set -a; . "$HOME/.codescan/release-credentials.env"; set +a
      fi
      pnpm run build:dmg
      # bundler 的 staple 可能静默跳过；有签名身份时显式补打并验收（未公证
      # 会在此 fail-closed，避免发布被 Gatekeeper 拦截的产物）
      if [ -n "${APPLE_SIGNING_IDENTITY:-}" ]; then
        # 产物路径在 CodeScan workspace 的 codescan/target/，不在 src-tauri 下
        APP="codescan/target/aarch64-apple-darwin/release/bundle/macos/Codescan.app"
        xcrun stapler staple "$APP"
        xcrun stapler validate "$APP"
      fi

  release:signing-check:
    desc: 发布产物签名验收（codesign/spctl/stapler；--allow-adhoc 放行未签名）
    platforms: [darwin]
    cmd: pnpm run release:signing-check -- "{{.CLI_ARGS}}"

  clean:build:
    desc: 清理构建产物（不做依赖级清理）
    cmd: pnpm run clean

  # ── 检查与测试 ────────────────────────────────────────────────────────

  notices:
    desc: 重新生成实际 macOS 分发依赖的第三方许可声明
    cmd: pnpm run generate:notices

  check:notices:
    desc: 检查第三方许可声明是否与锁定依赖同步（只读）
    cmd: pnpm run check:notices

  typecheck:
    desc: TypeScript 类型检查（strict）
    cmd: pnpm run typecheck

  test:
    desc: vitest 单元测试（apps/desktop）
    cmd: pnpm run test

  test:rust:
    desc: cargo test 全工作区（引擎 / 规则套件 / 命令层 / CLI）
    cmd: pnpm run test:rust

  test:cli:
    desc: CLI 黑盒测试（扫描 / 退出码 / SARIF 上传 dry-run）
    cmd: pnpm run test:cli

  check:rust:
    desc: cargo clippy（-D warnings）
    cmd: pnpm run check:rust

  check:
    desc: 提交前完整门禁（typecheck + vitest + 构建 + clippy + cargo test + 第三方声明漂移检查）
    cmd: pnpm run check

  # ── 扫描自身（dogfood）───────────────────────────────────────────────

  scan:
    desc: 用本地引擎扫描 CodeScan 工作区（text 输出）
    cmd: pnpm run scan

  scan:sarif:
    desc: 扫描 CodeScan 工作区并输出 SARIF 到 codescan/artifacts/codescan.sarif
    cmd: pnpm run scan:sarif

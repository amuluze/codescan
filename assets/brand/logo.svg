<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 260" role="img" aria-label="CodeScan logo">
  <defs>
    <linearGradient id="l-tile" x1="96" y1="64" x2="928" y2="960" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#131e30"/>
      <stop offset="0.55" stop-color="#0e1624"/>
      <stop offset="1" stop-color="#0a1019"/>
    </linearGradient>
    <linearGradient id="l-mark" x1="268" y1="248" x2="760" y2="760" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5b9cff"/>
      <stop offset="1" stop-color="#7ce6ff"/>
    </linearGradient>
    <linearGradient id="l-sheen" x1="256" y1="160" x2="768" y2="640" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.10"/>

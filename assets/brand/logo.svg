    <path d="M520 356 L602 462 L520 568" fill="none" stroke="#edf4ff" stroke-width="62"
          stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <text x="266" y="170" font-family="Inter, -apple-system, 'SF Pro Display', 'PingFang SC', sans-serif"
        font-size="112" font-weight="650" letter-spacing="-3.5" fill="#8b98a5">Code<tspan fill="url(#l-mark)">Scan</tspan></text>

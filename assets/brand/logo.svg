    <rect x="36" y="36" width="952" height="952" rx="220" fill="none" stroke="#2b3d58" stroke-width="8"/>
    <circle cx="462" cy="462" r="206" fill="none" stroke="url(#l-mark)" stroke-width="64"/>
    <path d="M618 618 L742 742" fill="none" stroke="url(#l-mark)" stroke-width="88" stroke-linecap="round"/>
    <path d="M404 356 L322 462 L404 568" fill="none" stroke="#edf4ff" stroke-width="62"

name: Bug report
description: Something behaves differently from the documented behaviour
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please do not paste API keys or other credentials —
        scan reports are enough to reproduce most issues.
  - type: input
    id: version
    attributes:
      label: Version
      description: App version, `engine_version` from the scan report, or commit SHA
      placeholder: "0.1.0 / engine 0.1.0 / abc1234"
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Surface
      options:
        - Desktop app
        - CLI
        - Engine (library/rules)
        - Documentation
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - macOS arm64
        - macOS x64
        - Other
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: Smallest steps or command that reproduces the problem
      placeholder: |
        codescan scan ./my-project --format text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
      description: Include the exact error text or output
    validations:
      required: true
  - type: textarea
    id: workspace
    attributes:
      label: Minimal workspace shape
      description: Languages and file kinds involved (no source code needed)
      placeholder: "TypeScript, 3 files under src/"

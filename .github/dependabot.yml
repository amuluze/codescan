version: 2
updates:
  # 只自动接收 patch/minor；major 留给人工评审（tree-sitter、sha2 等 major
  # 会带来 API 破坏）。push/PR CI 对依赖更新执行完整门禁。
  - package-ecosystem: cargo
    directory: "/codescan"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      rust:
        update-types:
          - patch
          - minor
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: "/codescan"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      js:
        update-types:
          - patch
          - minor
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      actions:
        update-types:
          - patch
          - minor
        patterns:
          - "*"

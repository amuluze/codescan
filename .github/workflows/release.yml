name: Release

# 平台支持：仅 macOS Apple Silicon (arm64)。
# Windows / Linux 构建暂不支持（发布矩阵刻意保持单目标）。

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: build aarch64-apple-darwin
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.96.0"

      - uses: Swatinem/rust-cache@v2
        with:
          key: aarch64-apple-darwin

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      # 未签名产物：macOS 需用户右键打开或 xattr 清除隔离属性；
      # 正式分发时通过仓库 Secrets 注入证书并在此处补签名/公证步骤。
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          tauriScript: pnpm tauri
          args: --target aarch64-apple-darwin
          tagName: ${{ github.ref_name }}
          releaseName: "Codescan ${{ github.ref_name }}"
          releaseBody: "本地代码扫描桌面工具（macOS Apple Silicon，未签名构建，首次打开需右键 → 打开）。Windows / Linux 暂不支持。"
          releaseDraft: true
          prerelease: false

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check
    runs-on: macos-15
    timeout-minutes: 45
    defaults:
      run:
        working-directory: codescan
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: codescan/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.96.0"

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: codescan
          key: ci-aarch64-apple-darwin

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Check all targets and third-party notices
        run: pnpm run check
